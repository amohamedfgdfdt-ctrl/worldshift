<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="WORLDSHIFT — TERRA: a living-world city simulator that runs in your browser.">
  <title>WORLDSHIFT — TERRA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d14'/%3E%3Cpath d='M6 22 14 8l5 8 3-4 4 10z' fill='%238b7cff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <header id="topbar" class="glass">
    <div class="brand"><span class="logo-mark"></span><span class="logo-text">WORLDSHIFT</span><span class="logo-sub">TERRA</span></div>
    <div class="stats">
      <div class="chip" title="Population"><span data-icon="users"></span><b id="stat-pop">0</b><span class="lbl">Population</span></div>
      <div class="chip" title="Buildings"><span data-icon="building"></span><b id="stat-bld">0</b><span class="lbl">Buildings</span></div>
      <div class="chip status" id="chip-status" title="Simulation state"><i class="dot"></i><span id="stat-state">Running ×1</span></div>
    </div>
    <button id="btn-settings" class="icon-btn" aria-label="Game settings" title="Game settings"></button>
  </header>

  <nav id="rail" class="glass" aria-label="Categories"></nav>
  <section id="panel" class="glass closed" aria-live="polite"></section>
  <aside id="info" class="glass closed"></aside>

  <div id="camtools"></div>
  <div id="hint"></div>
  <div id="actionbar" class="glass closed"></div>
  <footer id="simbar" class="glass"></footer>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <div id="loading">
    <div class="load-card">
      <div class="logo-mark big"></div>
      <h1>WORLDSHIFT</h1>
      <p id="load-text">Generating world…</p>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <div id="nogl" hidden>
    <div class="load-card">
      <h1>WebGL is not available</h1>
      <p>TERRA needs a browser with WebGL 2 enabled. Please try an up-to-date Chrome, Edge, Firefox or Safari.</p>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
